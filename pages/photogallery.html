<!doctype html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico" />

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css">
    <link href="/assets/css/main.css" rel="stylesheet">
    <link href="/assets/css/education.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/fontawesome651.all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        body {
            font-family: "Ubuntu Sans", sans-serif;
        }

        .container {
            max-width: 1200px;
        }

        /* Section title */
        .section-title {
            font-size: 1.9rem;
            font-weight: 600;
            margin-bottom: 30px;
            color: #1a1a1a;
        }

        /* Masonry grid */
        .gallery {
            column-count: 3;
            column-gap: 18px;
        }

        .gallery figure {
            display: inline-block;
            width: 100%;
            margin: 0 0 18px;
            break-inside: avoid;
            border-radius: 6px;
            overflow: hidden;
            background: #fafafa;
        }

        .gallery img {
            width: 100%;
            display: block;
        }

        /* Elegant captions */
        .gallery figcaption {
        padding: 8px 12px;
        margin: 8px;
        font-size: 0.85rem;
        color: rgb(46, 44, 45);
        text-align: center;
        background: #e1ecf5;
        border: 1.5px solid #ebeff5;   /* subtle border */
        border-radius: 5px;
        letter-spacing: 0.5px;
}


        /* Subtle hover */
        .gallery figure:hover {
            transform: translateY(-2px);
            transition: 0.2s ease;
        }

        /* Responsive */
        @media (max-width: 992px) {
            .gallery {
                column-count: 2;
            }
        }

        @media (max-width: 576px) {
            .gallery {
                column-count: 1;
            }
        }
    </style>
</head>

<p class="section-intro" style="font: bold;font-size: large;">

</p>
